# Pulls the forecast and rebuilds the site twice a day.
#
# The rebuild matters on its own, not just for the forecast: the countdown, the
# days-until column and the forecast's own staleness note are all computed at
# build time. Left alone, a page that says "73 days" keeps saying it.
#
# Timed to the readers, who are almost all in US Central. The countdown counts
# whole calendar days in that zone (see scripts/lib/days.mjs), so it ticks over
# at Central midnight and then holds still. The first run publishes that new
# number while everyone is still asleep.
#
# 06:15 UTC is 12:15am CST and 1:15am CDT, so it lands after Central midnight
# whichever side of the DST change we are on. Cron here cannot follow DST.
# 18:15 UTC is early afternoon Central, a second forecast pull during the day.
#
# Not on the hour: scheduled Actions queue behind everyone else's top-of-hour
# jobs and can be held up half an hour or more.
name: Refresh

on:
  schedule:
    - cron: "15 6,18 * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# Never let two refreshes race each other onto main.
concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    outputs:
      staged: ${{ steps.stage.outcome }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Open-Meteo being down should not stop the rebuild. The countdown still
      # needs moving, and the page already says how old the forecast is and
      # tells the reader to rerun it once it is two days past.
      - name: Pull the forecast
        id: forecast
        continue-on-error: true
        run: node scripts/forecast.mjs

      - name: Rebuild the site
        run: node scripts/build.mjs

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "nothing changed"
            exit 0
          fi
          if [ "${{ steps.forecast.outcome }}" = "success" ]; then
            git commit -m "Refresh the forecast and rebuild"
          else
            git commit -m "Rebuild (forecast fetch failed)"
          fi
          # A human may have pushed while this ran.
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin HEAD:main && exit 0
            echo "push $i failed, retrying"
            sleep 5
          done
          exit 1

      - name: Say if the forecast failed
        if: steps.forecast.outcome != 'success'
        run: |
          echo "::warning::Forecast fetch failed; site rebuilt on the previous forecast."

      # ---- publish, and only the site -----------------------------------
      #
      # Pages served straight off the branch until now, which meant the whole
      # repo was fetchable on the domain: scripts, templates, raw data, docs,
      # the social tooling. None of that is the site.
      #
      # The pages are self-contained (build.mjs inlines the CSS, the SVG and
      # the numbers, nothing is fetched at runtime), so photos/ is the only
      # asset directory the HTML actually points at.
      - name: Stage the site
        id: stage
        run: |
          set -euo pipefail
          rm -rf _site && mkdir -p _site/resorts
          cp ./*.html _site/
          cp resorts/*.html _site/resorts/
          cp -R photos _site/photos
          cp CNAME _site/CNAME
          cp .nojekyll _site/.nojekyll
          echo "staged $(find _site -type f | wc -l | tr -d ' ') files"

      # Fail loudly rather than quietly republishing the whole repo.
      - name: Refuse to publish anything that is not the site
        run: |
          set -euo pipefail
          for path in scripts templates data docs social README.md; do
            if [ -e "_site/$path" ]; then
              echo "::error::_site/$path should not be deployed"
              exit 1
            fi
          done
          grep -q "when can i" _site/index.html || {
            echo "::error::_site/index.html does not look like the site"; exit 1; }

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
